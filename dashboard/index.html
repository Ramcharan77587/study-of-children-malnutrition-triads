<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>NIErnaya | Health Intelligence Dashboard (WebAssembly)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #08111f;
      }
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #08111f;
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.5s ease;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #1e293b;
        border-top: 4px solid #0ea5e9;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <h2 style="margin: 0; color: #38bdf8;">NIErnaya 2026</h2>
      <p style="color: #94a3b8; font-size: 14px; margin-top: 8px;">Booting Python & Streamlit in WebAssembly...</p>
      <p style="color: #64748b; font-size: 12px;">Loading 706 factual districts & analytics models</p>
    </div>

    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

      mount(
        {
          requirements: ["pandas", "numpy", "plotly"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "./app.py",
            },
            "data/processed/nfhs5_india_district_child_malnutrition_factual.csv": {
              url: "../data/processed/nfhs5_india_district_child_malnutrition_factual.csv",
            },
            "data/processed/dataset_metadata_dictionary.csv": {
              url: "../data/processed/dataset_metadata_dictionary.csv",
            },
          },
        },
        document.getElementById("root")
      ).then(() => {
        const overlay = document.getElementById("loading-overlay");
        if (overlay) {
          overlay.style.opacity = "0";
          setTimeout(() => overlay.remove(), 600);
        }
      });
    </script>
  </body>
</html>
